<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}管理后台 - 新世界资源共享站{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        surface: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 700: '#1e293b', 800: '#1a2236', 900: '#151d2e' }
      }
    }
  }
}
</script>
<style>
  body { background: #0f172a; color: #e2e8f0; }
  .card { background: linear-gradient(135deg, #1e293b 0%, #1a2236 100%); border: 1px solid #334155; border-radius: 0.75rem; }
  .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; padding: 0.5rem 1.25rem; border-radius: 0.5rem; font-weight: 500; transition: opacity 0.2s; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-danger { background: #ef4444; color: white; padding: 0.5rem 1.25rem; border-radius: 0.5rem; font-weight: 500; transition: opacity 0.2s; }
  .btn-danger:hover { opacity: 0.9; }
  .btn-sm { padding: 0.25rem 0.75rem; font-size: 0.875rem; }
  .input { background: #1e293b; border: 1px solid #475569; color: #e2e8f0; padding: 0.5rem 0.75rem; border-radius: 0.5rem; width: 100%; }
  .input:focus { outline: none; border-color: #818cf8; box-shadow: 0 0 0 2px rgba(99,102,241,0.2); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 0.75rem 1rem; color: #94a3b8; font-weight: 500; font-size: 0.875rem; border-bottom: 1px solid #334155; }
  td { padding: 0.75rem 1rem; border-bottom: 1px solid #1e293b; font-size: 0.875rem; }
  tr:hover td { background: rgba(99,102,241,0.05); }
  .badge { display: inline-block; padding: 0.125rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; }
  .badge-green { background: rgba(34,197,94,0.15); color: #4ade80; }
  .badge-red { background: rgba(239,68,68,0.15); color: #f87171; }
</style>
</head>
<body class="min-h-screen">
<nav class="sticky top-0 z-50 backdrop-blur-md bg-slate-900/80 border-b border-slate-700/50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="text-lg font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">新世界 ADM</span>
      <span class="text-xs text-slate-500">|</span>
      <a href="/admin/web" class="text-sm text-slate-300 hover:text-white transition">仪表盘</a>
      <a href="/admin/web/users" class="text-sm text-slate-300 hover:text-white transition">用户</a>
      <a href="/admin/web/logs" class="text-sm text-slate-300 hover:text-white transition">日志</a>
    </div>
    <div class="flex items-center gap-4">
      <a href="/" target="_blank" class="text-sm text-slate-400 hover:text-white transition">门户 →</a>
      <a href="/admin/web/logout" class="text-sm text-slate-400 hover:text-red-400 transition">登出</a>
    </div>
  </div>
</nav>
<main class="max-w-7xl mx-auto px-4 py-6">
{% block content %}{% endblock %}
</main>

<script>
function showToast(msg, ok = true) {
  const el = document.createElement('div');
  el.className = 'fixed bottom-6 right-6 px-4 py-3 rounded-lg text-sm font-medium shadow-lg z-50 ' + (ok ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; setTimeout(() => el.remove(), 300); }, 2500);
}

async function api(path, opts = {}) {
  const res = await fetch(path, { credentials: 'same-origin', headers: { 'Content-Type': 'application/json', ...(opts.headers||{}) }, ...opts });
  if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.detail || '请求失败'); }
  return res.json();
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
