{% extends "site_base.html" %}
{% block title %}注册 - 新世界资源共享站{% endblock %}
{% block content %}
<section class="max-w-sm mx-auto px-4 py-16">
  <h1 class="text-2xl font-bold text-center mb-6">用户注册</h1>
  <div class="card p-6">
    <div id="error-box" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-2 rounded-lg mb-4 text-sm"></div>
    <form id="reg-form" onsubmit="doRegister(event)">
      <label class="block text-sm text-slate-400 mb-1">邮箱</label>
      <input type="email" id="email" class="input mb-4" placeholder="your@email.com" required>
      <label class="block text-sm text-slate-400 mb-1">昵称（可选）</label>
      <input type="text" id="nickname" class="input mb-4" placeholder="怎么称呼你">
      <label class="block text-sm text-slate-400 mb-1">密码</label>
      <input type="password" id="password" class="input mb-4" placeholder="至少8位" minlength="8" required>
      <button type="submit" class="w-full btn-primary">注册</button>
    </form>
    <p class="text-sm text-slate-500 text-center mt-4">已有账号？<a href="/login" class="text-indigo-400">去登录</a></p>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script>
async function doRegister(e) {
  e.preventDefault();
  document.getElementById('error-box').classList.add('hidden');
  try {
    const res = await fetch('/auth/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        email: document.getElementById('email').value,
        nickname: document.getElementById('nickname').value,
        password: document.getElementById('password').value
      })
    });
    if (!res.ok) { const d = await res.json(); throw new Error(d.detail || '注册失败'); }
    // 注册成功后自动登录
    const loginRes = await fetch('/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    const data = await loginRes.json();
    localStorage.setItem('access_token', data.access_token);
    localStorage.setItem('refresh_token', data.refresh_token);
    window.location.href = '/console';
  } catch(e) {
    const el = document.getElementById('error-box');
    el.textContent = e.message;
    el.classList.remove('hidden');
  }
}
</script>
{% endblock %}
